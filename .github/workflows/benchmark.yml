name: Benchmark

on:
  push:
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Run benchmark
        run: npm test

      - name: Generate runtime boundary corpus
        run: npm run generate:runtime

      - name: Run runtime boundary benchmark
        run: npm run report:runtime
